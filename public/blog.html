<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8">
  <title data-i18n="blog.title">Blog | Mosankai</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/i18n.css">
  <link rel="stylesheet" href="/blog.css">
  <script src="/i18n.js"></script>
</head>
<body class="blog-page">
  <header class="blog-header">
    <div class="blog-header-inner">
      <span class="blog-wordmark">MOSANKAI</span>
      <nav class="blog-nav" aria-label="Blog navigation" data-i18n-aria-label="blog.navigation">
        <a href="/" data-i18n="blog.home">Home</a>
        <a href="/blog" id="blog-nav-articles" data-i18n="blog.articles">Articles</a>
        <a href="/findatime" data-i18n="blog.findatime">Find a Time</a>
      </nav>
      <div id="language-switcher-slot" class="language-switcher-slot"></div>
    </div>
  </header>
  <main class="blog-main">
    <section id="blog-index" aria-labelledby="blog-heading" hidden>
      <header class="blog-heading">
        <h1 id="blog-heading" data-i18n="blog.heading">Blog</h1>
        <p data-i18n="blog.byAuthor">By Moses Xie</p>
      </header>
      <div id="blog-list" class="blog-list"></div>
    </section>
    <article id="blog-detail" class="blog-detail" hidden></article>
    <div id="blog-status" class="blog-status">
      <p id="blog-status-message" role="status"></p>
      <a id="blog-status-back" class="blog-back" href="/blog" data-i18n="blog.backToArticles" hidden>Back to Articles</a>
      <button id="blog-retry" type="button" class="comment-secondary-button" data-i18n="blog.retry" hidden>Try again</button>
    </div>
  </main>
  <script>
    const articlePath = /^\/blog\/([^/]+)\/?$/.exec(window.location.pathname)?.[1];
    let blogs;
    let viewStatus = 'blog.loading';
    let currentBlog = null;
    let activeReplyId = null;
    let activeEditId = null;
    let commentFeedback = null;
    const COMMENT_TOKEN_KEY = 'mosankai:blog-comment-tokens:v1';
    const COMMENT_NAME_KEY = 'mosankai:blog-comment-name:v1';
    const HTML_ENTITIES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const t = (key, parameters) => MosankaiI18n.t(key, parameters);

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => HTML_ENTITIES[character]);
    }

    function safeImage(value) {
      const candidate = String(value || '').trim();
      if (!candidate || candidate === '/img/default.jpg') return '';
      if (/^data:image\/(?:png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(candidate)) {
        return candidate;
      }
      if (candidate.startsWith('/') && !candidate.startsWith('//')) return candidate;
      try {
        const parsed = new URL(candidate);
        return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
      } catch {
        return '';
      }
    }

    function formatBlogDate(value) {
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime())
        ? value
        : new Intl.DateTimeFormat(MosankaiI18n.locale(), {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          }).format(date);
    }

    function formatCommentDate(comment) {
      const value = comment.createdAt || comment.date;
      const date = new Date(String(value || '').includes('T') ? value : `${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return value;
      const options = comment.createdAt
        ? { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }
        : { year: 'numeric', month: 'short', day: 'numeric' };
      return new Intl.DateTimeFormat(MosankaiI18n.locale(), options).format(date);
    }

    function loadCommentTokens() {
      try {
        const value = JSON.parse(localStorage.getItem(COMMENT_TOKEN_KEY) || '{}');
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      } catch {
        return {};
      }
    }

    let commentTokens = loadCommentTokens();

    function persistCommentTokens() {
      try {
        const recentEntries = Object.entries(commentTokens).slice(-200);
        commentTokens = Object.fromEntries(recentEntries);
        localStorage.setItem(COMMENT_TOKEN_KEY, JSON.stringify(commentTokens));
      } catch {
        // Keep ownership available for the current page when storage is unavailable.
      }
    }

    function rememberCommentToken(commentId, token) {
      if (!commentId || !token) return;
      commentTokens[commentId] = token;
      persistCommentTokens();
    }

    function forgetCommentToken(commentId) {
      delete commentTokens[commentId];
      persistCommentTokens();
    }

    function storedCommentName() {
      try {
        return localStorage.getItem(COMMENT_NAME_KEY) || '';
      } catch {
        return '';
      }
    }

    function rememberCommentName(name) {
      try {
        localStorage.setItem(COMMENT_NAME_KEY, name);
      } catch {
        // The comment can still be posted when storage is unavailable.
      }
    }

    function commentActions(comment, allowReply) {
      if (comment.withdrawn) return '';
      const owned = Boolean(commentTokens[comment.id]);
      return `
        <div class="comment-item-actions">
          ${allowReply ? `<button type="button" class="comment-link-button" data-comment-action="reply" data-comment-id="${escapeHtml(comment.id)}">${escapeHtml(t(activeReplyId === comment.id ? 'blog.cancel' : 'blog.reply'))}</button>` : ''}
          ${owned ? `<button type="button" class="comment-link-button" data-comment-action="edit" data-comment-id="${escapeHtml(comment.id)}">${escapeHtml(t(activeEditId === comment.id ? 'blog.cancel' : 'blog.edit'))}</button>` : ''}
          ${owned ? `<button type="button" class="comment-link-button danger" data-comment-action="withdraw" data-comment-id="${escapeHtml(comment.id)}">${escapeHtml(t('blog.withdraw'))}</button>` : ''}
        </div>`;
    }

    function editForm(comment) {
      if (activeEditId !== comment.id) return '';
      return `
        <form class="comment-inline-form edit-comment-form" data-comment-id="${escapeHtml(comment.id)}">
          <label for="edit-comment-${escapeHtml(comment.id)}">${escapeHtml(t('blog.editComment'))}</label>
          <textarea id="edit-comment-${escapeHtml(comment.id)}" maxlength="2000" required>${escapeHtml(comment.text)}</textarea>
          <div class="comment-form-actions">
            <button type="button" class="comment-secondary-button" data-comment-action="cancel">${escapeHtml(t('blog.cancel'))}</button>
            <button type="submit" class="comment-primary-button">${escapeHtml(t('blog.saveEdit'))}</button>
          </div>
        </form>`;
    }

    function replyForm(comment) {
      if (activeReplyId !== comment.id) return '';
      return `
        <form class="comment-inline-form reply-comment-form" data-parent-id="${escapeHtml(comment.id)}">
          <label>${escapeHtml(t('blog.replyTo', { name: comment.name }))}</label>
          <input name="name" type="text" maxlength="40" value="${escapeHtml(storedCommentName())}" aria-label="${escapeHtml(t('blog.yourName'))}" placeholder="${escapeHtml(t('blog.yourName'))}" required>
          <textarea name="text" maxlength="2000" aria-label="${escapeHtml(t('blog.yourReply'))}" placeholder="${escapeHtml(t('blog.yourReply'))}" required></textarea>
          <div class="comment-form-actions">
            <button type="button" class="comment-secondary-button" data-comment-action="cancel">${escapeHtml(t('blog.cancel'))}</button>
            <button type="submit" class="comment-primary-button">${escapeHtml(t('blog.postReply'))}</button>
          </div>
        </form>`;
    }

    function commentMarkup(comment, replies = [], isReply = false) {
      const edited = comment.updatedAt && !comment.withdrawn
        ? `<span class="comment-edited">${escapeHtml(t('blog.edited'))}</span>`
        : '';
      const body = comment.withdrawn
        ? `<p class="comment-text withdrawn">${escapeHtml(t('blog.commentWithdrawn'))}</p>`
        : `<p class="comment-text">${escapeHtml(comment.text)}</p>`;
      return `
        <article class="comment-item${isReply ? ' comment-reply' : ''}" data-comment-id="${escapeHtml(comment.id)}">
          <header class="comment-header">
            <strong>${escapeHtml(comment.name || t('blog.anonymous'))}</strong>
            <span><time>${escapeHtml(formatCommentDate(comment))}</time>${edited}</span>
          </header>
          ${body}
          ${commentActions(comment, !isReply)}
          ${editForm(comment)}
          ${!isReply && replies.length ? `<div class="comment-replies">${replies.map(reply => commentMarkup(reply, [], true)).join('')}</div>` : ''}
          ${!isReply ? replyForm(comment) : ''}
        </article>`;
    }

    function commentsMarkup(comments) {
      if (!comments.length) return `<p class="comments-empty">${escapeHtml(t('blog.noComments'))}</p>`;
      const ids = new Set(comments.map(comment => comment.id));
      const replies = new Map();
      comments.filter(comment => comment.parentId && ids.has(comment.parentId)).forEach(comment => {
        if (!replies.has(comment.parentId)) replies.set(comment.parentId, []);
        replies.get(comment.parentId).push(comment);
      });
      return comments
        .filter(comment => !comment.parentId || !ids.has(comment.parentId))
        .map(comment => commentMarkup(comment, replies.get(comment.id) || []))
        .join('');
    }

    function feedbackMarkup() {
      if (!commentFeedback) return '';
      const message = commentFeedback.key
        ? t(commentFeedback.key, commentFeedback.parameters)
        : commentFeedback.message;
      return escapeHtml(message || '');
    }

    function commentErrorKey(code) {
      const keys = {
        emptyComment: 'blog.emptyComment',
        invalidReplyTarget: 'blog.invalidReplyTarget',
        notCommentOwner: 'blog.notCommentOwner',
        commentNotFound: 'blog.commentNotFound',
        commentSaveFailed: 'blog.commentSaveFailed'
      };
      return keys[code] || null;
    }

    async function commentRequest(method, body) {
      const response = await fetch(`/api/blogs/${encodeURIComponent(currentBlog.id)}/comments`, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(result.error || t('blog.commentSaveFailed'));
        error.translationKey = commentErrorKey(result.code);
        throw error;
      }
      return result;
    }

    function applyCommentResult(result, feedbackKey) {
      currentBlog = { ...currentBlog, comments: result.comments || currentBlog.comments };
      activeReplyId = null;
      activeEditId = null;
      commentFeedback = { key: feedbackKey, error: false };
      renderBlogDetail(currentBlog, false);
    }

    function showCommentError(error) {
      commentFeedback = error.translationKey
        ? { key: error.translationKey, error: true }
        : { message: error.message, error: true };
      const feedback = document.getElementById('comment-feedback');
      if (feedback) {
        feedback.className = 'comment-feedback error';
        feedback.textContent = error.translationKey ? t(error.translationKey) : error.message;
      }
    }

    function blogDateMarkup(date) {
      if (!date) return '';
      return `<time class="blog-date" datetime="${escapeHtml(date)}">${escapeHtml(formatBlogDate(date))}</time>`;
    }

    function blogTagsMarkup(tags) {
      if (!tags?.length) return '';
      return `<div class="blog-tags">${tags.map(tag => `<span class="blog-tag">${escapeHtml(tag)}</span>`).join('')}</div>`;
    }

    function renderBlogList() {
      const list = blogs.map((blog, index) => `
        <article class="blog-item">
          <a class="blog-entry" href="/blog/${encodeURIComponent(blog.slug || blog.id)}" aria-labelledby="post-title-${index}">
            ${blogDateMarkup(blog.date)}
            <div class="blog-entry-copy">
              <h2 id="post-title-${index}" class="blog-title">${escapeHtml(blog.title)}</h2>
              ${blog.excerpt ? `<p class="blog-excerpt">${escapeHtml(blog.excerpt)}</p>` : ''}
              ${blog.author ? `<p class="blog-byline">${escapeHtml(blog.author)}</p>` : ''}
              ${blogTagsMarkup(blog.tags)}
            </div>
            <span class="blog-arrow" aria-hidden="true">→</span>
          </a>
        </article>`).join('');
      document.getElementById('blog-list').innerHTML = list || `<p class="blog-empty">${escapeHtml(t('blog.noPosts'))}</p>`;
    }

    function renderBlogDetail(blog) {
      const richContent = blog.contentFormat === 'html' && blog.contentHtml;
      const content = richContent ? blog.contentHtml : escapeHtml(blog.content);
      const image = safeImage(blog.image);
      document.getElementById('blog-detail').innerHTML = `
        <a href="/blog" class="blog-back"><span aria-hidden="true">←</span> ${escapeHtml(t('blog.backToArticles'))}</a>
        <header class="blog-detail-heading">
          <h1>${escapeHtml(blog.title)}</h1>
          <div class="blog-detail-meta">
            ${blogDateMarkup(blog.date)}
            <span>${escapeHtml(blog.author || t('blog.anonymous'))}</span>
          </div>
        </header>
        ${image ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(t('blog.imageAlt'))}" class="blog-detail-image">` : ''}
        <div class="blog-content${richContent ? '' : ' blog-content-plain'}">${content}</div>
        ${blogTagsMarkup(blog.tags)}
        <section class="comments-section" aria-labelledby="comments-title">
          <div class="comments-heading">
            <h2 id="comments-title">${escapeHtml(t('blog.comments'))}</h2>
            <span class="comment-count">${escapeHtml((blog.comments || []).length === 1
              ? t('blog.oneComment')
              : t('blog.commentCount', { count: (blog.comments || []).length }))}</span>
          </div>
          <p class="comments-hint">${escapeHtml(t('blog.commentsHint'))}</p>
          <div id="comment-feedback" class="comment-feedback${commentFeedback?.error ? ' error' : ''}" aria-live="polite">${feedbackMarkup()}</div>
          <div id="comments" class="comments-list">${commentsMarkup(blog.comments || [])}</div>
          <form id="comment-form" class="comment-composer">
            <label for="c-text">${escapeHtml(t('blog.addComment'))}</label>
            <input type="text" id="c-name" maxlength="40" value="${escapeHtml(storedCommentName())}" aria-label="${escapeHtml(t('blog.yourName'))}" placeholder="${escapeHtml(t('blog.yourName'))}" required>
            <textarea id="c-text" maxlength="2000" placeholder="${escapeHtml(t('blog.yourComment'))}" required></textarea>
            <div class="comment-form-actions">
              <button type="submit" class="comment-primary-button">${escapeHtml(t('blog.postComment'))}</button>
            </div>
          </form>
        </section>
      `;
      document.getElementById('comment-form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = document.getElementById('c-name').value.trim();
        const text = document.getElementById('c-text').value.trim();
        if (!name || !text) {
          const error = new Error(t('blog.emptyComment'));
          error.translationKey = 'blog.emptyComment';
          showCommentError(error);
          return;
        }
        const submitButton = event.submitter || event.currentTarget.querySelector('[type="submit"]');
        submitButton.disabled = true;
        try {
          const result = await commentRequest('POST', { name, text });
          rememberCommentName(name);
          rememberCommentToken(result.comment?.id, result.editToken);
          applyCommentResult(result, 'blog.commentPosted');
        } catch (error) {
          showCommentError(error);
          submitButton.disabled = false;
        }
      });

      document.getElementById('comments').addEventListener('click', async event => {
        const button = event.target.closest('[data-comment-action]');
        if (!button) return;
        const action = button.dataset.commentAction;
        const commentId = button.dataset.commentId;
        if (action === 'cancel') {
          activeReplyId = null;
          activeEditId = null;
          renderBlogDetail(currentBlog, false);
          return;
        }
        if (action === 'reply') {
          activeReplyId = activeReplyId === commentId ? null : commentId;
          activeEditId = null;
          renderBlogDetail(currentBlog, false);
          requestAnimationFrame(() => document.querySelector('.reply-comment-form textarea')?.focus());
          return;
        }
        if (action === 'edit') {
          activeEditId = activeEditId === commentId ? null : commentId;
          activeReplyId = null;
          renderBlogDetail(currentBlog, false);
          requestAnimationFrame(() => document.querySelector('.edit-comment-form textarea')?.focus());
          return;
        }
        if (action === 'withdraw' && confirm(t('blog.confirmWithdraw'))) {
          button.disabled = true;
          try {
            const result = await commentRequest('DELETE', {
              commentId,
              editToken: commentTokens[commentId]
            });
            forgetCommentToken(commentId);
            applyCommentResult(result, 'blog.commentRemoved');
          } catch (error) {
            showCommentError(error);
            button.disabled = false;
          }
        }
      });

      document.getElementById('comments').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.target;
        const submitButton = event.submitter || form.querySelector('[type="submit"]');
        submitButton.disabled = true;
        try {
          if (form.matches('.reply-comment-form')) {
            const name = form.elements.name.value.trim();
            const text = form.elements.text.value.trim();
            if (!name || !text) {
              submitButton.disabled = false;
              const error = new Error(t('blog.emptyComment'));
              error.translationKey = 'blog.emptyComment';
              showCommentError(error);
              return;
            }
            const result = await commentRequest('POST', {
              name,
              text,
              parentId: form.dataset.parentId
            });
            rememberCommentName(name);
            rememberCommentToken(result.comment?.id, result.editToken);
            applyCommentResult(result, 'blog.replyPosted');
          } else if (form.matches('.edit-comment-form')) {
            const commentId = form.dataset.commentId;
            const text = form.querySelector('textarea').value.trim();
            if (!text) {
              submitButton.disabled = false;
              const error = new Error(t('blog.emptyComment'));
              error.translationKey = 'blog.emptyComment';
              showCommentError(error);
              return;
            }
            const result = await commentRequest('PATCH', {
              commentId,
              text,
              editToken: commentTokens[commentId]
            });
            applyCommentResult(result, 'blog.editSaved');
          }
        } catch (error) {
          showCommentError(error);
          submitButton.disabled = false;
        }
      });
    }

    function renderView() {
      document.getElementById('blog-detail').hidden = !currentBlog;
      document.getElementById('blog-status').hidden = !viewStatus;
      document.getElementById('blog-status-message').textContent = viewStatus ? t(viewStatus) : '';
      document.getElementById('blog-status-back').hidden = viewStatus !== 'blog.notFound';
      document.getElementById('blog-retry').hidden = viewStatus !== 'blog.loadError';
      if (currentBlog) renderBlogDetail(currentBlog);
      else if (blogs) renderBlogList();
    }

    async function loadView() {
      viewStatus = 'blog.loading';
      renderView();
      try {
        const response = await fetch(articlePath ? `/api/blogs/${articlePath}` : '/api/blogs');
        if (articlePath && response.status === 404) {
          viewStatus = 'blog.notFound';
        } else {
          if (!response.ok) throw new Error('Unable to load blog');
          if (articlePath) currentBlog = await response.json();
          else blogs = await response.json();
          viewStatus = null;
        }
      } catch {
        viewStatus = 'blog.loadError';
      }
      renderView();
    }

    document.getElementById('blog-index').hidden = Boolean(articlePath);
    document.getElementById('blog-nav-articles').setAttribute('aria-current', articlePath ? 'location' : 'page');
    document.getElementById('blog-retry').addEventListener('click', loadView);
    window.addEventListener('mosankai:languagechange', renderView);
    loadView();
  </script>
</body>
</html>
